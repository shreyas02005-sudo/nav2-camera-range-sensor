name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-checks:
    name: Script syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile Python scripts
        run: python -m compileall -q scripts launch perception

      - name: Check shell script syntax
        run: bash -n scripts/clean_gz.sh perception/spawn_boxes.sh
